<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles.css">

</head>
<body>

    <div class="container">

        <header class="hero">

            <nav class="nav">

                <a href="./" class="nav__logo-link">
                    <img src="./assets/logo.svg" class="nav__logo">
                </a>

                <label class="nav__label">
                    <input type="checkbox" class="nav__checkbox">
                </label>

                <ul class="nav__list">
                    <li class="nav__element">
                        <a href="#" class="nav__link">Sobre Nosotros</a>
                    </li>
                    <li class="nav__element">
                        <a href="#" class="nav__link">Servicios</a>
                    </li>
                    <li class="nav__element">
                        <a href="#" class="nav__link">FAQ</a>
                    </li>
                    <li class="nav__element">
                        <a href="#" class="nav__link">Newsletter</a>
                    </li>
                    <li class="nav__element">
                        <a href="#" class="nav__link nav__link--cta">Contacto</a>
                    </li>
                </ul>

            </nav>

            <section class="hero__main">
                <h1 class="hero__title">Transforma tu Visión en Realidad Digital</h1>

                <figure class="hero__figure">
                    <img src="./assets/header-img.png" class="hero__img">
                </figure>

                <p class="hero__paragraph">Desde lading pages impactantes hasta sitios web completos, creamos soluciones que destacan y convierten.</p>

                <a href="#" class="hero__cta">Agenda una cita</a>

            </section>

        </header>

    </div>
    
</body>
</html>
